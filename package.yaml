name:                pystrformat
version:             0.1.0.0
synopsis:            Full-weight string formatting library, analog of Python's string.format
description: >
                     This package contains full-featured string formatting function, similar to
                     Python's string.format. Features include:

                     * Automatically numbered variable placeholders;

                     * Positional variable placeholders;

                     * Named variable placeholders;

                     * Placeholders can be used in any order; one variable can be used several
                       times or not used at all.

                     * Specific format can be used for each variable substitution.

                     This package prefers functionality over "light weight" and (probably) performance. 
                     It also exposes all required interfaces to extend and customize it.

                     See the README and @examples/@ directory for details.

category:            Text
license:             BSD3
license-file:        LICENSE
author:              Ilya Portnov
maintainer:          Leonid Bobylev
homepage:            https://github.com/lbobylev/pystrformat#pystrformat
bug-reports:         https://github.com/lbobylev/pystrformat/issues

extra-source-files:
  - ChangeLog.md
  - README.md
  - examples/test.hs
  - examples/Benchmarks.hs

library:
  source-dirs: .
  dependencies:
      - base >=4.20 && <5
      - text >=2.1 && <3
      - bytestring >= 0.12 && <0.13
      - parsec >=3.1.18 && <3.2
      - containers >= 0.7 && <0.8
      - data-default >= 0.8 && <0.9
      - time >= 1.12 && <1.15
      - template-haskell >= 2.22 && <2.24
      - th-lift >= 0.8 && <0.9
      - th-lift-instances >= 0.1 && <0.2
      - labels >= 0.3 && <0.4

tests:
  spec:
    source-dirs: tests
    main: Spec.hs
    dependencies:
      - base >= 4.20 && < 5
      - bytestring >= 0.12 && <0.13
      - time >= 1.12 && <1.15
      - pystrformat
      - containers
      - text
      - hspec

github: lbobylev/pystrformat
